version: '3.8'

services:
  telegram_bot:
    build: .
    container_name: animexin-bot
    restart: always
    volumes:
      - .:/app
    environment:
      # --- Put your variables here or set them directly in bot.py ---
      - API_ID=123456
      - API_HASH=your_api_hash_here
      - BOT_TOKEN=your_bot_token_here
      - CHANNEL_ID=-1003966911002
      
      # Set your target country's timezone so that 17:00 aligns with your 5:00 PM
      - TZ=Asia/Jakarta
      
      # Customize the exact execution time format "HH:MM" (Optional)
      - SCHEDULE_TIME=17:00
