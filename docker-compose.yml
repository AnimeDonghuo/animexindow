services:
  telegram_bot:
    build: .
    container_name: animexin-bot
    restart: always
    volumes:
      - .:/app
      # Lets /update rebuild + restart this container and prune old images.
      - /var/run/docker.sock:/var/run/docker.sock
    # ALL secrets live in .env (git-ignored) so that `git reset --hard`
    # and /update can NEVER overwrite your real tokens again.
    env_file:
      - .env
    environment:
      - CHANNEL_ID=${CHANNEL_ID:--1003966911002}
      # Extra channels for the poster card (comma separated)
      - EXTRA_CHANNELS=${EXTRA_CHANNELS:-}
      - MONGO_DB=${MONGO_DB:-animexin}
      - MONGO_COLL=${MONGO_COLL:-episodes}

      # --- self-update ---
      - REPO_DIR=/app
      - UPDATE_BRANCH=arena/01a0749f-animexindow
      - COMPOSE_SERVICE=telegram_bot
      # Telegram user ids allowed to run /update (comma separated, blank = all)
      - ADMINS=${ADMINS:-}

      - TZ=Asia/Jakarta
      - SCHEDULE_TIME=17:00

      # --- 1 vCPU TUNING ---
      # Re-encoded ladder (1080p is NOT in here - see passthrough below)
      - QUALITIES=360p,480p,720p
      # 1080p is uploaded exactly as downloaded from the site (no CPU cost).
      - ENABLE_PASSTHROUGH=1
      - PASSTHROUGH_QUALITY=1080p
      # ...unless the original is bigger than this, then it is shrunk to fit.
      - PASSTHROUGH_MAX_GB=1.95
      # veryfast ~= half the file size of ultrafast for a little more CPU.
      - X264_PRESET=veryfast
      - CRF_360=28
      - CRF_480=27
      - CRF_720=26
      - AUDIO_BITRATE=96k
      # 0 = let ffmpeg pick (on 1 vCPU that is effectively 1 anyway)
      - FFMPEG_THREADS=0
      # Kill ffmpeg only after 10 min of NO progress, not on a wall clock.
      - FFMPEG_STALL_TIMEOUT=600
      # Absolute ceiling = 25x the video duration (24min ep -> 10h max)
      - FFMPEG_MAX_RT_FACTOR=25
      - FFMPEG_MIN_DEADLINE=1800
      # Seconds between Telegram progress edits (avoids flood + not-modified)
      - EDIT_INTERVAL=12

    # Keep the encoder from freezing the whole VPS (SSH stays responsive)
    cpu_shares: 512
    mem_limit: 900m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
